[project]
name = "bendtorch-gate"
version = "0.1.0"
description = "Reproducible verification tooling for the native Bend2 tensor core"
requires-python = "==3.13.*"
dependencies = []

[tool.ruff]
target-version = "py313"
extend-exclude = [".tools", "oracle"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["tools", "tests", "verification", "dev"]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "ty==0.0.84",
]
