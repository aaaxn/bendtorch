[high-fork-reuses-base]
file = "src/tensor/parallel.bend"
before = '''
def upper(+inner: Nat, +base: Nat) -> Nat:
  Nat.add(Model.capacity(inner), base)'''
after = '''
def upper(+inner: Nat, +base: Nat) -> Nat:
  base'''

[cell-swaps-operands]
file = "src/tensor/elementwise.bend"
before = '''
  (scalar(operation, x, y), (la, ra))'''
after = '''
  (scalar(operation, y, x), (la, ra))'''

[cell-swaps-returned-inputs]
file = "src/tensor/elementwise.bend"
before = '''
  (scalar(operation, x, y), (la, ra))'''
after = '''
  (scalar(operation, x, y), (ra, la))'''

[padding-not-zero]
file = "src/tensor/elementwise.bend"
before = '''
    case False{}:
      (0.0, (la, ra))'''
after = '''
    case False{}:
      (1.0, (la, ra))'''

[leaf-writes-zero]
file = "src/tensor/parallel.bend"
before = '''
  (ALeaf{value}, state)'''
after = '''
  (ALeaf{0.0}, state)'''
