[add-reduces-to-other-operand]
file = "src/autograd/tensor-backward.bend"
before = '''
  added_first(b, right, reduced(a, left, g))'''
after = '''
  added_first(b, right, reduced(a, right, g))'''

[add-sends-second-to-first]
file = "src/autograd/tensor-backward.bend"
before = '''
  added_first(b, right, reduced(a, left, g))'''
after = '''
  added_first(a, right, reduced(a, left, g))'''

[sub-keeps-sign]
file = "src/autograd/tensor-backward.bend"
before = '''
      negated_pair(product(Elementwise.NegateLeft{}, g,'''
after = '''
      negated_pair(product(Elementwise.KeepLeft{}, g,'''

[mul-swaps-operands]
file = "src/autograd/tensor-backward.bend"
before = '''
      multiplied_first(a, b, left, right, x, product(Elementwise.Mul{}, g, y))'''
after = '''
      multiplied_first(a, b, left, right, y, product(Elementwise.Mul{}, g, x))'''

[product-swaps-inputs]
file = "src/autograd/tensor-backward.bend"
before = '''
      Elementwise.allocated(operation, plan, left, right, Core.new(Shape.output_shape(plan), 0.0))'''
after = '''
      Elementwise.allocated(operation, plan, right, left, Core.new(Shape.output_shape(plan), 0.0))'''
