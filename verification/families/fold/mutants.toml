[negative-zero-start]
file = "src/tensor/contracts/fold.bend"
before = '''
  loop(~O, ~g, ~P, ~ia, ~keep, count, operation, plan, 0n, input, 0.0)'''
after = '''
  loop(~O, ~g, ~P, ~ia, ~keep, count, operation, plan, 0n, input, F32.neg(0.0))'''

[swapped-accumulator]
file = "src/tensor/contracts/fold.bend"
before = '''
      rec(input, chosen(~O, ~g, operation, kept, accumulator, x))'''
after = '''
      rec(input, chosen(~O, ~g, operation, kept, x, accumulator))'''

[dropped-word]
file = "src/tensor/contracts/fold.bend"
before = '''
      rec(input, chosen(~O, ~g, operation, kept, accumulator, x))'''
after = '''
      rec(input, accumulator)'''

[ignored-mask]
file = "src/tensor/contracts/fold.bend"
before = '''
      step(~O, ~g, operation, keep(plan, cursor), input =>'''
after = '''
      step(~O, ~g, operation, True{}, input =>'''

[cursor-off-by-one]
file = "src/tensor/contracts/fold.bend"
before = '''
  loop(~O, ~g, ~P, ~ia, ~keep, count, operation, plan, 0n, input, 0.0)'''
after = '''
  loop(~O, ~g, ~P, ~ia, ~keep, count, operation, plan, 1n, input, 0.0)'''

[pair-swapped-operands]
file = "src/tensor/contracts/fold.bend"
before = '''
      rec(left, right, g(operation, accumulator, x, y))'''
after = '''
      rec(left, right, g(operation, accumulator, y, x))'''

[pair-wrong-map]
file = "src/tensor/contracts/fold.bend"
before = '''
        right, accumulator, Core.read_dynamic(left, U32.from_nat(ia(plan, cursor))))'''
after = '''
        right, accumulator, Core.read_dynamic(left, U32.from_nat(ib(plan, cursor))))'''

[pair-negative-zero-start]
file = "src/tensor/contracts/fold.bend"
before = '''
  pair_loop(~O, ~g, ~P, ~ia, ~ib, count, operation, plan, 0n, left, right, 0.0)'''
after = '''
  pair_loop(~O, ~g, ~P, ~ia, ~ib, count, operation, plan, 0n, left, right, F32.neg(0.0))'''

[pair-cursor-off-by-one]
file = "src/tensor/contracts/fold.bend"
before = '''
  pair_loop(~O, ~g, ~P, ~ia, ~ib, count, operation, plan, 0n, left, right, 0.0)'''
after = '''
  pair_loop(~O, ~g, ~P, ~ia, ~ib, count, operation, plan, 1n, left, right, 0.0)'''

[sum-swapped-add]
file = "src/tensor/contracts/sum.bend"
before = '''
  F32.add(accumulator, word)'''
after = '''
  F32.add(word, accumulator)'''

[dot-untransposed-right]
file = "src/tensor/contracts/dot.bend"
before = '''
  Nat.add(Nat.mul(k, columns), column)'''
after = '''
  Nat.add(Nat.mul(column, inner), k)'''

[failed-step-done]
file = "src/tensor/contracts/fold.bend"
before = '''
      (input, Fail{error})'''
after = '''
      (input, Done{accumulator})'''

[pair-left-failed-done]
file = "src/tensor/contracts/fold.bend"
before = '''
      ((left, right), Fail{error})
    case Done{x}:'''
after = '''
      ((left, right), Done{accumulator})
    case Done{x}:'''

[pair-right-failed-swapped]
file = "src/tensor/contracts/fold.bend"
before = '''
      ((left, right), Fail{error})
    case Done{y}:'''
after = '''
      ((right, left), Fail{error})
    case Done{y}:'''

[matmul-swapped-strides]
file = "src/tensor/matmul.bend"
before = '''
    case 1n+rest:
      product_run(rest, 1n, columns, Nat.add(Nat.mul(row, inner), cursor), Nat.add(Nat.mul(cursor, columns), column), accumulator,'''
after = '''
    case 1n+rest:
      product_run(rest, columns, 1n, Nat.add(Nat.mul(row, inner), cursor), Nat.add(Nat.mul(cursor, columns), column), accumulator,'''

[matmul-negative-zero-start]
file = "src/tensor/matmul.bend"
before = '''
  cell_dot(inner, inner, columns, row_of(columns, position), column_of(columns, position), 0n, 0.0, la, ra)'''
after = '''
  cell_dot(inner, inner, columns, row_of(columns, position), column_of(columns, position), 0n, F32.neg(0.0), la, ra)'''

[matmul-transposed-right]
file = "src/tensor/matmul.bend"
before = '''
  U32.from_nat(Nat.add(Nat.mul(k, columns), column))'''
after = '''
  U32.from_nat(Nat.add(Nat.mul(column, columns), k))'''

[nt-reads-weight-untransposed]
file = "src/tensor/matmul.bend"
before = '''
  product(Kept{}, Kept{}, left, right)'''
after = '''
  product(Kept{}, Swapped{}, left, right)'''

[tn-swaps-operands]
file = "src/tensor/matmul.bend"
before = '''
  product(Swapped{}, Swapped{}, left, right)'''
after = '''
  product(Swapped{}, Swapped{}, right, left)'''

[product-kept-reads-swapped]
file = "src/tensor/matmul.bend"
before = '''
    case Kept{}:
      Nat.add(Nat.mul(outer, inner), k)'''
after = '''
    case Kept{}:
      Nat.add(Nat.mul(k, inner), outer)'''

[product-row-crossed-terms]
file = "src/tensor/matmul.bend"
before = '''
F32.add(a3, F32.mul(x, y3))'''
after = '''
F32.add(a3, F32.mul(x, y4))'''

[product-row-unchecked]
file = "src/tensor/matmul.bend"
before = '''
Nat.is_eq(row_of(columns, Nat.add(7n, base)), row_of(columns, base)), True{}'''
after = '''
True{}, True{}'''
