[lands-on-source]
file = "src/autograd/reduce_fold.bend"
before = '''
  Nat.is_eq(target_offset(plan, position), U32.to_nat(index))'''
after = '''
  Nat.is_eq(contribution_offset(plan, position), U32.to_nat(index))'''

[inverted-mask]
file = "src/autograd/reduce_fold.bend"
before = '''
  Nat.is_eq(target_offset(plan, position), U32.to_nat(index))'''
after = '''
  Bool.not(Nat.is_eq(target_offset(plan, position), U32.to_nat(index)))'''

[reads-target-offset]
file = "src/autograd/reduce_fold.bend"
before = '''
  contribution_offset(plan, position)'''
after = '''
  target_offset(plan, position)'''

[target-count]
file = "src/autograd/reduce_fold.bend"
before = '''
Cell{plan, index}, Shape.elements(Shape.right_shape(plan)), input)'''
after = '''
Cell{plan, index}, Shape.elements(Shape.left_shape(plan)), input)'''

[reduce-to-walks-target-stride]
file = "src/autograd/reduce.bend"
before = '''
        fiber(rest, others, first_span(rest, others), inner, Nat.add(base, Nat.mul(right, digit)), first_digit(rest, inner),'''
after = '''
        fiber(rest, others, first_span(rest, others), inner, Nat.add(base, Nat.mul(left, digit)), first_digit(rest, inner),'''

[reduce-to-strided-walks-target-stride]
file = "src/autograd/reduce.bend"
before = '''
      strided(fuel, right, base, digit, single_offset(rest, others, Nat.mod(target, left), 0n), accumulator, array)'''
after = '''
      strided(fuel, left, base, digit, single_offset(rest, others, Nat.mod(target, left), 0n), accumulator, array)'''

[reduce-to-skips-last-digit]
file = "src/autograd/reduce.bend"
before = '''
    case 0n:
      extent'''
after = '''
    case 0n:
      Nat.sub(extent, 1n)'''

[reduce-to-starts-negative-zero]
file = "src/autograd/reduce.bend"
before = '''
  fiber_fast(rows, extents, first_span(rows, extents), single_below(rows, extents), target, 0n, first_digit(rows, target), 0.0, array)'''
after = '''
  fiber_fast(rows, extents, first_span(rows, extents), single_below(rows, extents), target, 0n, first_digit(rows, target), F32.neg(0.0), array)'''

[reduce-to-swapped-add]
file = "src/autograd/reduce.bend"
before = '''
  (F32.add(accumulator, word), kept)'''
after = '''
  (F32.add(word, accumulator), kept)'''

[sum-to-size-identity-folds]
file = "src/autograd/sum_to_size.bend"
before = '''
    case True{}:
      cloned(shape, Core.clone(shape, tensor))'''
after = '''
    case True{}:
      Reduce.reduce_to(Core.Packed{shape, tensor}, target)'''

[sum-to-size-reduced-clones]
file = "src/autograd/sum_to_size.bend"
before = '''
    case False{}:
      Reduce.reduce_to(Core.Packed{shape, tensor}, target)'''
after = '''
    case False{}:
      cloned(shape, Core.clone(shape, tensor))'''
