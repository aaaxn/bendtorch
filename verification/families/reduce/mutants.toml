[lands-on-source]
file = "src/autograd/reduce-fold.bend"
before = '''
  Nat.is_eq(target_offset(plan, position), U32.to_nat(index))'''
after = '''
  Nat.is_eq(contribution_offset(plan, position), U32.to_nat(index))'''

[inverted-mask]
file = "src/autograd/reduce-fold.bend"
before = '''
  Nat.is_eq(target_offset(plan, position), U32.to_nat(index))'''
after = '''
  Bool.not(Nat.is_eq(target_offset(plan, position), U32.to_nat(index)))'''

[reads-target-offset]
file = "src/autograd/reduce-fold.bend"
before = '''
  contribution_offset(plan, position)'''
after = '''
  target_offset(plan, position)'''

[target-count]
file = "src/autograd/reduce-fold.bend"
before = '''
Cell{plan, index}, Shape.elements(Shape.right_shape(plan)), input)'''
after = '''
Cell{plan, index}, Shape.elements(Shape.left_shape(plan)), input)'''

[reduce-to-lands-on-source]
file = "src/autograd/reduce.bend"
before = '''
      (+target_index, source_index) = indices
      step_input(target, target_index, output, Core.read_dynamic(input, source_index))'''
after = '''
      (+target_index, +source_index) = indices
      step_input(target, source_index, output, Core.read_dynamic(input, source_index))'''

[reduce-to-reversed-order]
file = "src/autograd/reduce.bend"
before = '''
  step_indices(target, state, Elementwise.input_indices(plan, index))'''
after = '''
  step_indices(target, state, Elementwise.input_indices(plan,
    U32.from_nat(Nat.sub(Nat.sub(Shape.elements(Shape.output_shape(plan)), 1n), U32.to_nat(index)))))'''

[reduce-to-swapped-add]
file = "src/autograd/reduce.bend"
before = '''
F32.add(accumulated, value)'''
after = '''
F32.add(value, accumulated)'''

[sum-to-size-identity-folds]
file = "src/autograd/sum-to-size.bend"
before = '''
    case True{}:
      cloned(shape, Core.clone(shape, tensor))'''
after = '''
    case True{}:
      Reduce.reduce_to(Core.Packed{shape, tensor}, target)'''

[sum-to-size-reduced-clones]
file = "src/autograd/sum-to-size.bend"
before = '''
    case False{}:
      Reduce.reduce_to(Core.Packed{shape, tensor}, target)'''
after = '''
    case False{}:
      cloned(shape, Core.clone(shape, tensor))'''
