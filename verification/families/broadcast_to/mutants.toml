[adds-zero]
file = "src/autograd/broadcast.bend"
before = '''
      finish(Elementwise.parallel_allocated(Elementwise.KeepLeft{}, plan, input, Core.Packed{target, zeros},'''
after = '''
      finish(Elementwise.parallel_allocated(Elementwise.Add{}, plan, input, Core.Packed{target, zeros},'''

[swapped-operands]
file = "src/autograd/broadcast.bend"
before = '''
      finish(Elementwise.parallel_allocated(Elementwise.KeepLeft{}, plan, input, Core.Packed{target, zeros},'''
after = '''
      finish(Elementwise.parallel_allocated(Elementwise.KeepLeft{}, plan, Core.Packed{target, zeros}, input,'''

[returns-zero-owner]
file = "src/autograd/broadcast.bend"
before = '''
    case Done{output}:
      (input, Done{output})'''
after = '''
    case Done{output}:
      (zeros, Done{output})'''
