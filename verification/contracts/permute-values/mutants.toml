[permute-forward-map]
file = "src/tensor/transforms.bend"
before = '''
    case Done{mapping}:
      copy_read(input, axes, plan, i, rec, target,
        Core.read_flat(input, source, Layout.source_index(input, axes, plan, i, mapping)))'''
after = '''
    case Done{mapping}:
      copy_read(input, axes, plan, Layout.source_index(input, axes, plan, i, mapping), rec, target,
        Core.read_flat(input, source, i))'''

[transpose-swap-ignored]
file = "src/tensor/transforms.bend"
before = '''
    case Shape.BTrue{equal}:
      permute_copy(input, source, Layout.transpose_axes(Shape.dimensions(input), a, b, 0))'''
after = '''
    case Shape.BTrue{equal}:
      permute_copy(input, source, Layout.transpose_axes(Shape.dimensions(input), a, a, 0))'''
