[permute-forward-map]
file = "src/tensor/permute_build.bend"
before = '''
  Recipe{picks(Shape.rank_dimensions(dims), Shape.naturals(axes), Shape.naturals(Axis.order(U32, dims, Shape.naturals(axes))), 0n),
    strides(Shape.naturals(dims))}'''
after = '''
  +out = Axis.order(U32, dims, Shape.naturals(axes))
  Recipe{picks(Shape.rank_dimensions(out), Axis.inverse_axes(Shape.rank_dimensions(dims), Shape.naturals(axes)), Shape.naturals(dims), 0n),
    strides(Shape.naturals(out))}'''

[permute-identity-map]
file = "src/tensor/permute_build.bend"
before = '''
def at(+recipe: Recipe, +position: Nat) -> U32:
  U32.from_nat(source(recipe, position))'''
after = '''
def at(+recipe: Recipe, +position: Nat) -> U32:
  U32.from_nat(position)'''

[transpose-swap-ignored]
file = "src/tensor/transforms.bend"
before = '''
    case Shape.BTrue{equal}:
      permute_copy(input, source, Layout.transpose_axes(Shape.dimensions(input), a, b, 0))'''
after = '''
    case Shape.BTrue{equal}:
      permute_copy(input, source, Layout.transpose_axes(Shape.dimensions(input), a, a, 0))'''
