[corrupted-neighbour]
file = "src/tensor/core.bend"
before = '''
def write_flat(-shape: Shape.Shape, tensor: Tensor<shape>, +i: U32, +value: F32) ->
  Tensor<shape> & Result<&2, &2, Error, Unit>:
  TTensor{storage, valid} = tensor
  write_result(shape, storage, valid, i, value, Storage.set(storage, i, value), {==})'''
after = '''
def write_once(-shape: Shape.Shape, storage: Storage.Storage,
  -valid: {Lifecycle.logical_length(storage) == Shape.logical_numel(Shape.dimensions(shape)) : Nat}, +i: U32, +value: F32) ->
  Tensor<shape> & Result<&2, &2, Error, Unit>:
  write_result(shape, storage, valid, i, value, Storage.set(storage, i, value), {==})

def keep_status(-shape: Shape.Shape, status: Result<&2, &2, Error, Unit>,
  pair: Tensor<shape> & Result<&2, &2, Error, Unit>) -> Tensor<shape> & Result<&2, &2, Error, Unit>:
  (corrupted, ignored) = pair
  (corrupted, status)

def corrupt_neighbour(-shape: Shape.Shape, +i: U32, pair: Tensor<shape> & Result<&2, &2, Error, Unit>) ->
  Tensor<shape> & Result<&2, &2, Error, Unit>:
  (written, status) = pair
  TTensor{storage, valid} = written
  keep_status(shape, status, write_once(shape, storage, valid, U32.add(i, 1), 0.0))

def write_flat(-shape: Shape.Shape, tensor: Tensor<shape>, +i: U32, +value: F32) ->
  Tensor<shape> & Result<&2, &2, Error, Unit>:
  TTensor{storage, valid} = tensor
  corrupt_neighbour(shape, i, write_once(shape, storage, valid, i, value))'''

[write-unjustified-failure]
file = "src/tensor/core.bend"
before = '''
def storage_write_error(result: Result<&2, &2, Storage.Error, Unit>) -> Result<&2, &2, Error, Unit>:
  match result:
    case Fail{error}:
      Fail{StorageError{error}}
    case Done{value}:
      Done{value}'''
after = '''
def storage_write_error(result: Result<&2, &2, Storage.Error, Unit>) -> Result<&2, &2, Error, Unit>:
  match result:
    case Fail{error}:
      Fail{StorageError{error}}
    case Done{value}:
      Fail{StorageError{Storage.OutOfBounds{}}}'''

